name: Fetch Vosk Korean Model Artifact

on:
  push:
    paths:
      - '.github/workflows/fetch-vosk-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  VOSK_WHEEL_URL: https://files.pythonhosted.org/packages/fc/ca/83398cfcd557360a3d7b2d732aee1c5f6999f68618d1645f38d53e14c9ff/vosk-0.3.45-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.whl
  VOSK_MODEL_URL: https://alphacephei.com/vosk/models/vosk-model-small-ko-0.22.zip

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          set -euxo pipefail
          mkdir -p assets
          curl --fail --location --retry 5 --retry-delay 2 "$VOSK_WHEEL_URL" --output assets/vosk.whl
          curl --fail --location --retry 5 --retry-delay 2 "$VOSK_MODEL_URL" --output assets/model.zip
          sha256sum assets/* > assets/SHA256SUMS.txt
          ls -lh assets
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vosk-korean-assets-local-stt
          path: assets/
          compression-level: 0
          retention-days: 1
      - name: Publish run ID marker
        run: |
          set -euxo pipefail
          printf '%s\n' '${{ github.run_id }}' > vosk_artifact_run_id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vosk_artifact_run_id.txt
          git commit -m 'Record Vosk artifact workflow run ID' || exit 0
          git push
