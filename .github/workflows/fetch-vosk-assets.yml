name: Fetch Vosk Korean Assets

on:
  push:
    paths:
      - '.github/workflows/fetch-vosk-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VOSK_WHEEL_URL: https://files.pythonhosted.org/packages/fc/ca/83398cfcd557360a3d7b2d732aee1c5f6999f68618d1645f38d53e14c9ff/vosk-0.3.45-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.whl
  VOSK_MODEL_URL: https://alphacephei.com/vosk/models/vosk-model-small-ko-0.22.zip

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Vosk package and Korean model
        run: |
          set -euxo pipefail
          mkdir -p assets
          curl --fail --location --retry 4 --retry-delay 2 "$VOSK_WHEEL_URL" --output assets/vosk-0.3.45-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.whl
          curl --fail --location --retry 4 --retry-delay 2 "$VOSK_MODEL_URL" --output assets/vosk-model-small-ko-0.22.zip
          sha256sum assets/* | tee assets/SHA256SUMS.txt
          ls -lh assets
      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: vosk-korean-assets
          path: assets/
          compression-level: 0
          retention-days: 1
