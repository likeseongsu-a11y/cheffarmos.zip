name: Cleanup Temporary Speech Assets

on:
  push:
    paths:
      - '.github/workflows/fetch-vosk-assets.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary transcription assets and workflow
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -rf tmp-assets || true
          git rm -f .github/workflows/fetch-vosk-assets.yml || true
          git commit -m "Remove temporary speech-recognition assets" || exit 0
          git push
