name: Transcribe 93oppa V8 Audio

on:
  push:
    paths:
      - 'input_audio_v8.opus.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Rebuild local Korean speech model and audio
        run: |
          set -euxo pipefail
          cat tmp-assets/vosk.whl.part-* > /tmp/vosk.whl
          cat tmp-assets/model.zip.part-* > /tmp/model.zip
          sha256sum /tmp/vosk.whl /tmp/model.zip
          python -m pip install /tmp/vosk.whl
          unzip -q /tmp/model.zip -d /tmp/vosk-model
          base64 -d input_audio_v8.opus.b64 > /tmp/input.opus
          ffmpeg -hide_banner -loglevel error -y -i /tmp/input.opus -ac 1 -ar 16000 -c:a pcm_s16le /tmp/input.wav
      - name: Transcribe and make timed subtitles
        run: |
          cat > /tmp/transcribe.py <<'PY'
          import json, wave, os, glob
          from vosk import Model, KaldiRecognizer, SetLogLevel
          SetLogLevel(-1)
          model_dirs=[p for p in glob.glob('/tmp/vosk-model/*') if os.path.isdir(p)]
          if not model_dirs: raise SystemExit('model folder missing')
          wf=wave.open('/tmp/input.wav','rb')
          rec=KaldiRecognizer(Model(model_dirs[0]), wf.getframerate())
          rec.SetWords(True)
          results=[]
          while True:
              data=wf.readframes(8000)
              if not data: break
              if rec.AcceptWaveform(data):
                  r=json.loads(rec.Result())
                  if r.get('result'): results.append(r)
          r=json.loads(rec.FinalResult())
          if r.get('result'): results.append(r)
          words=[]
          for r in results: words.extend(r.get('result',[]))
          # Group at pauses, 13 Korean chars/line, max 3.8 seconds.
          groups=[]; cur=[]
          def emit():
              nonlocal cur
              if not cur: return
              groups.append({'start':cur[0]['start'],'end':cur[-1]['end'],'text':' '.join(w['word'] for w in cur),'words':cur})
              cur=[]
          for w in words:
              if cur:
                  pause=w['start']-cur[-1]['end']
                  chars=sum(len(x['word']) for x in cur)+len(cur)-1
                  dur=w['end']-cur[0]['start']
                  if pause>0.72 or chars+len(w['word'])+1>24 or dur>3.8:
                      emit()
              cur.append(w)
          emit()
          def stamp(t):
              ms=round(t*1000); h=ms//3600000; ms%=3600000; m=ms//60000; ms%=60000; s=ms//1000; ms%=1000
              return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'
          with open('transcript_v8.json','w',encoding='utf-8') as f: json.dump({'words':words,'segments':groups},f,ensure_ascii=False,indent=2)
          with open('transcript_v8.txt','w',encoding='utf-8') as f:
              for g in groups: f.write(f"[{g['start']:.2f}-{g['end']:.2f}] {g['text']}\n")
          with open('transcript_v8.srt','w',encoding='utf-8') as f:
              for i,g in enumerate(groups,1): f.write(f"{i}\n{stamp(g['start'])} --> {stamp(g['end'])}\n{g['text']}\n\n")
          print('words',len(words),'segments',len(groups))
          PY
          python /tmp/transcribe.py
      - name: Commit transcript
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add transcript_v8.json transcript_v8.srt transcript_v8.txt
          git commit -m 'Add V8 Korean transcript and subtitle timings' || exit 0
          git push
